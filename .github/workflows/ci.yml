# Tests automatiques sur un vrai Windows à chaque modification.
# Publication : quand $AppVersion (src/Common.ps1) passe à un numéro qui n'a pas
# encore de version publiée, et que les tests passent, GitHub Actions crée le tag
# vX.Y.Z et publie le ZIP dans l'onglet "Releases" : c'est là que Driver va
# chercher ses mises à jour.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntaxe des scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($e in $parseErrors) {
              Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $errors++
            }
          }
          if ($errors) { exit 1 }
          Write-Host 'Aucune erreur de syntaxe.'

      - name: Chargement de l'interface (XAML + code C#)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $script:AppRoot = (Get-Location).Path
            . .\src\Loader.ps1
            . .\src\Gui.ps1
            [xml]$xaml = Get-Content .\src\MainWindow.xaml -Raw -Encoding UTF8
            $window = [System.Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader $xaml))
            foreach ($node in $xaml.SelectNodes('//*[@*[local-name()="Name"]][not(ancestor::*[local-name()="ControlTemplate"])]')) {
              $n = $node.GetAttribute('Name', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ($n -and -not $window.FindName($n)) { throw "Element introuvable dans la fenetre : $n" }
            }
            foreach ($k in @('Card', 'CardWarn', 'BtnSmall', 'BtnPrimary', 'BtnLink', 'Check')) { [void]$window.FindResource($k) }
            foreach ($kind in @('gpu', 'audio', 'effect', 'net', 'chipset', 'bt', 'storage', 'other')) { [void](New-IconBadge $kind) }
            [void](New-Pill 'A jour' $false); [void](New-VersionText '610.88' '621.14'); [void](New-Text 'test' 12 'Muted')
            [void](New-Columns @('Auto', '*', '80'))
            Initialize-NewDevApi
            Write-Host "Interface chargee : $($window.Title)"
          } catch {
            Write-Host "::error::$($_.Exception.Message) $($_.InvocationInfo.PositionMessage)"
            exit 1
          }

      - name: Tests unitaires (Pester 5)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5
          $r = Invoke-Pester -Path .\tests -PassThru -Output Detailed
          foreach ($t in $r.Failed) { Write-Host "::error::$($t.ExpandedPath) : $($t.ErrorRecord.Exception.Message)" }
          if ($r.FailedCount -gt 0) { exit 1 }

  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version à publier ?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "AppVersion\s*=\s*'\K[0-9.]+" src/Common.ps1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La version v$VERSION est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version à publier : v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Création du ZIP
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p dist/driver
          cp -r DriverUpdater.ps1 Install.ps1 Uninstall.ps1 README.md LICENSE src dist/driver/
          cd dist && zip -r "driver-v${{ steps.version.outputs.version }}.zip" driver
      - name: Publication de la version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.version.outputs.version }}"
          gh release create "$V" "dist/driver-$V.zip" --target "$GITHUB_SHA" --title "Driver $V" --generate-notes
