# Tests automatiques sur un vrai Windows à chaque modification.
# Publication : quand $AppVersion (src/Common.ps1) passe à un numéro qui n'a pas
# encore de version publiée, et que les tests passent, GitHub Actions crée le tag
# vX.Y.Z et publie le ZIP dans l'onglet "Releases" : c'est là que Driver va
# chercher ses mises à jour.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntaxe des scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = 0
          # Sans BOM UTF-8, Windows PowerShell 5.1 lit le fichier en ANSI : les accents et les
          # tirets typographiques deviennent des guillemets parasites.
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $hasBom -and @($bytes | Where-Object { $_ -gt 127 }).Count) {
              Write-Host "::error file=$($_.Name)::Fichier non ASCII sans BOM UTF-8"
              $errors++
            }
          }
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($e in $parseErrors) {
              Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $errors++
            }
          }
          if ($errors) { exit 1 }
          Write-Host 'Aucune erreur de syntaxe.'

      - name: Chargement de l'interface (XAML + code C#)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $script:AppRoot = (Get-Location).Path
            . .\src\Loader.ps1
            . .\src\Gui.ps1
            [xml]$xaml = Get-Content .\src\MainWindow.xaml -Raw -Encoding UTF8
            $window = [System.Windows.Markup.XamlReader]::Load((New-Object System.Xml.XmlNodeReader $xaml))
            foreach ($node in $xaml.SelectNodes('//*[@*[local-name()="Name"]][not(ancestor::*[local-name()="ControlTemplate"])]')) {
              $n = $node.GetAttribute('Name', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ($n -and -not $window.FindName($n)) { throw "Element introuvable dans la fenetre : $n" }
            }
            foreach ($k in @('Card', 'CardWarn', 'BtnSmall', 'BtnPrimary', 'BtnLink', 'Check')) { [void]$window.FindResource($k) }
            foreach ($kind in @('gpu', 'audio', 'effect', 'net', 'chipset', 'bt', 'storage', 'other')) { [void](New-IconBadge $kind) }
            [void](New-Pill 'A jour' $false); [void](New-VersionText '610.88' '621.14'); [void](New-Text 'test' 12 'Muted')
            [void](New-Columns @('Auto', '*', '80'))
            Initialize-NewDevApi
            Write-Host "Interface chargee : $($window.Title)"
          } catch {
            Write-Host "::error::$($_.Exception.Message) $($_.InvocationInfo.PositionMessage)"
            exit 1
          }

      - name: Tests unitaires (Pester 5)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5
          $r = Invoke-Pester -Path .\tests -PassThru -Output Detailed
          foreach ($t in $r.Failed) { Write-Host "::error::$($t.ExpandedPath) : $($t.ErrorRecord.Exception.Message)" }
          if ($r.FailedCount -gt 0) { exit 1 }

  # Essai complet sur un vrai Windows, avec le réseau : installateur en un clic,
  # puis mise à jour automatique de Driver telle que l'application la fait.
  installation:
    needs: tests
    runs-on: windows-latest
    # Informatif : dépend de la disponibilité de GitHub vue depuis les machines de test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Diagnostic reseau GitHub
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $tests = @(
            @{ Name = 'API sans authentification'; Url = 'https://api.github.com/repos/${{ github.repository }}/releases/latest'; Auth = $false }
            @{ Name = 'API avec jeton';            Url = 'https://api.github.com/repos/${{ github.repository }}/releases/latest'; Auth = $true }
            @{ Name = 'Page releases/latest';      Url = 'https://github.com/${{ github.repository }}/releases/latest'; Auth = $false }
            @{ Name = 'Archive codeload';          Url = 'https://codeload.github.com/${{ github.repository }}/zip/refs/heads/main'; Auth = $false }
          )
          foreach ($t in $tests) {
            try {
              $req = [System.Net.HttpWebRequest]::Create($t.Url)
              $req.UserAgent = 'Driver-CI'; $req.AllowAutoRedirect = $false; $req.Timeout = 20000
              if ($t.Auth) { $req.Headers['Authorization'] = "Bearer $env:GH_TOKEN" }
              $resp = $req.GetResponse(); $code = [int]$resp.StatusCode; $resp.Close()
            } catch [System.Net.WebException] {
              $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { $_.Exception.Status }
            }
            Write-Host ("{0,-28} -> {1}" -f $t.Name, $code)
          }

      - name: Installateur en un clic (Installer-Driver.cmd)
        shell: cmd
        run: Installer-Driver.cmd

      - name: Verification de l'installation
        shell: powershell
        run: |
          $main = Join-Path $env:ProgramFiles 'DriverUpdater\DriverUpdater.ps1'
          if (-not (Test-Path $main)) { Write-Host "::error::DriverUpdater.ps1 absent de Program Files"; exit 1 }
          if (-not (Get-ScheduledTask -TaskName 'DriverUpdater' -ErrorAction SilentlyContinue)) { Write-Host "::error::Tache planifiee absente"; exit 1 }
          Write-Host "Installation OK : $main"

      - name: Mise a jour automatique (API GitHub, telechargement, Install.ps1)
        shell: powershell
        run: |
          try {
            $script:AppRoot = (Get-Location).Path
            . .\src\Loader.ps1
            Initialize-AppFolder
            $r = Get-LatestAppRelease
            if (-not $r.Version -or -not $r.AssetUrl) { throw "Reponse GitHub incomplete" }
            Write-Host "Derniere version publiee : $($r.Version)"
            $res = Install-AppUpdate -AssetUrl $r.AssetUrl -Version $r.Version -AssetWebUrl $r.AssetWebUrl
            if (-not $res.Success) { throw "Install-AppUpdate : $($res.Message)" }
            Write-Host "Mise a jour automatique OK : $($res.Message)"
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            Get-ChildItem "$env:ProgramData\DriverUpdater\logs" -Filter *.log | ForEach-Object { Get-Content $_.FullName -Tail 30 }
            exit 1
          }

  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version à publier ?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "AppVersion\s*=\s*'\K[0-9.]+" src/Common.ps1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La version v$VERSION est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version à publier : v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Création du ZIP
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p dist/driver
          cp -r DriverUpdater.ps1 Install.ps1 Uninstall.ps1 README.md LICENSE src dist/driver/
          cd dist && zip -r "driver-v${{ steps.version.outputs.version }}.zip" driver
      - name: Publication de la version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.version.outputs.version }}"
          gh release create "$V" "dist/driver-$V.zip" Installer-Driver.cmd --target "$GITHUB_SHA" --title "Driver $V" --generate-notes
